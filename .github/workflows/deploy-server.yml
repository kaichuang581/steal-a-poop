name: Deploy server

# Manual on purpose: a server deploy restarts every game in progress (rooms live in memory) and may change the database.
# Run it from the Actions tab: choose the branch, and whether to apply pending database migrations first.
on:
  workflow_dispatch:
    inputs:
      migrate:
        description: 'Apply pending database migrations first'
        type: boolean
        default: true

# The token only needs to read the code; the deploy itself uses FLY_API_TOKEN. Keep DATABASE_URL and FLY_API_TOKEN as
# secrets of the production environment (not repository secrets), so no other workflow or branch can read them.
permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only main is deployed. Put a required reviewer on this environment (Settings, Environments) so a second person
    # approves every server deploy, and limit its deployment branches to main there too.
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:server
      - name: Show pending migrations
        if: inputs.migrate
        run: npm run migrate -- --dry-run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply migrations
        if: inputs.migrate
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Pinned to a commit: this step runs in the job that holds FLY_API_TOKEN, so it must not follow a moving branch.
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master on 2026-10-30
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
