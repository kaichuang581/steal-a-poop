name: Painted

# The checks that open the painted game, the look players see (docs/visual-overhaul/16-qa-and-acceptance.md, 4.1).
# Three jobs, and their names are the names branch protection asks for: smoke, gate, check-scenes.
# Read-only, and it needs no secrets.
# Run by hand only (Actions, "Run workflow"): Brian chose on 2026-11-16 to test the overhaul once, at the end, not on
# every pull request. To make these required checks again, add `pull_request:` and `push: branches: [main]` here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: painted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The painted build in a real browser: first visit, Home, a word typed at the table, practice, the Trading Post,
  # and the fault cases (no WebGL, a lost context, a missing file).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Browsers are keyed to the Playwright version in the lockfile, so a cache hit is safe.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:painted
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: painted-smoke-results
          path: |
            test-results
            playwright-report
          retention-days: 7

  # Everything a milestone is judged by, head against base (tools/gate/README.md).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The whole history: the gate finds the base with `git merge-base HEAD origin/main` and checks it out.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # A branch named overhaul/mNN-... is milestone NN; anything else is "none": every check runs, nothing is written
      # into the repo, and a changed picture is listed for the reviewer. The branch name is read from the environment,
      # never pasted into the script. The cache sits outside the checkout, so the tree stays clean.
      - name: Find the base commit and the milestone
        id: facts
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          base=$(git merge-base HEAD origin/main)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "GATE_CACHE=$RUNNER_TEMP/fleeced-gate" >> "$GITHUB_ENV"
          if [[ "$HEAD_BRANCH" =~ ^overhaul/m([0-9]{2})- ]]; then
            echo "milestone=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "milestone=none" >> "$GITHUB_OUTPUT"
          fi
      # What the gate keeps about the base commit (its build, its pictures, its test report) is the same for every
      # pull request cut from that commit, so it is kept between runs. The fonts go with it: until they ship with the
      # game they are fetched from outside, and a kept base picture can only be compared with a head picture set in
      # the very same font files.
      - name: Cache the base commit's part of the gate cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.GATE_CACHE }}/${{ steps.facts.outputs.base }}
            ${{ env.GATE_CACHE }}/fonts
          key: gate-base-${{ runner.os }}-${{ steps.facts.outputs.base }}-${{ hashFiles('package-lock.json') }}
      - run: node tools/gate/gate.mjs --milestone ${{ steps.facts.outputs.milestone }}
      # Always: a failed gate is when the pictures and the report are wanted most.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-report-and-shots
          path: |
            ${{ env.GATE_CACHE }}/reports
            ${{ env.GATE_CACHE }}/logs
            ${{ env.GATE_CACHE }}/**/*.png
            !${{ env.GATE_CACHE }}/wt/**
            !${{ env.GATE_CACHE }}/**/dist-gate/**
          if-no-files-found: warn
          retention-days: 14

  # Every scene and model built and judged (plan file 18, section 4.2). It is a required check, so it must never be
  # "skipped": when no scene file changed it says so and ends green at once.
  check-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: See whether a scene file changed
        id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "A push to main: the scenes are always checked."
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base HEAD origin/main)
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          if grep -E '^(src/skin/(scene|voxel|table|dream)/|tools/scenes/|docs/visual-overhaul/(EXEMPT|RATCHETS)\.json$)' "$RUNNER_TEMP/changed.txt"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "No scene, voxel, table or dream file changed against $base, nor tools/scenes, EXEMPT.json or RATCHETS.json: nothing to check. Green."
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run == 'yes'
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.run == 'yes'
        run: npm ci
      - if: steps.changed.outputs.run == 'yes'
        run: npm run check:scenes
