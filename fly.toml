# fly.toml app configuration file generated for steal-a-poop-server on 2026-11-07T22:11:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'steal-a-poop-server'
primary_region = 'yyz'

[build]
[env]
  NODE_ENV = 'production'
  PORT = '8080'
  TRUST_PROXY = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1500
    soft_limit = 800

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
